<!DOCTYPE html>
<html>
<head>
    <title>P2P Stream Portal</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; border: 1px solid #333; }
        video { width: 100%; border-radius: 5px; margin: 10px 0; background: #000; }
        textarea { width: 100%; height: 80px; font-family: monospace; font-size: 10px; margin: 10px 0; block-size: border-box; }
        .status { color: #00ff00; font-size: 12px; margin: 10px; font-style: italic; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 5px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="box">
    <h3>1. Prepare Media</h3>
    <button onclick="setup('cam')">Use Camera</button>
    <button onclick="document.getElementById('fileIn').click()">Loop Video File</button>
    <input type="file" id="fileIn" accept="video/*" style="display:none" onchange="setup('file')">
    <video id="v" autoplay playsinline controls></video>
    <div id="status" class="status">Waiting for media...</div>

    <hr>

    <h3>2. Connect</h3>
    <p style="font-size: 12px;">Sender: Click Start. Give code to Friend.<br>
       Friend: Paste code, Click Join. Give code back to Sender.</p>
    
    <button onclick="startOffer()">[Sender] Start Stream</button>
    <button onclick="startAnswer()">[Friend] Join Stream</button>

    <textarea id="outputSdp" readonly placeholder="Your generated code will appear here..."></textarea>
    <textarea id="inputSdp" placeholder="Paste your friend's code here..."></textarea>
    
    <button id="finalBtn" onclick="finish()" style="background:#059669; display:none;">Finish Connection</button>
</div>

<script>
let pc = new RTCPeerConnection({ iceServers: [] });
let log = document.getElementById('status');

function setStatus(msg) { log.innerText = "Status: " + msg; }

// 1. Setup Media
async function setup(type) {
    let stream;
    if (type === 'cam') {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('v').srcObject = stream;
    } else {
        const file = document.getElementById('fileIn').files[0];
        const v = document.getElementById('v');
        v.srcObject = null;
        v.src = URL.createObjectURL(file);
        v.loop = true;
        v.play();
        stream = v.captureStream();
    }
    stream.getTracks().forEach(track => pc.addTrack(track, stream));
    setStatus("Media Ready. Choose 'Start' or 'Join'.");
}

// 2. Sender: Create Offer
async function startOffer() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    
    // Wait for address gathering
    pc.onicecandidate = (e) => {
        if (!e.candidate) {
            document.getElementById('outputSdp').value = btoa(JSON.stringify(pc.localDescription));
            setStatus("Copy your code and give it to your friend.");
            document.getElementById('finalBtn').style.display = "inline-block";
        }
    };
}

// 3. Friend: Create Answer
async function startAnswer() {
    const raw = document.getElementById('inputSdp').value;
    if (!raw) return alert("Paste the sender's code first!");
    
    try {
        const offer = JSON.parse(atob(raw));
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        pc.onicecandidate = (e) => {
            if (!e.candidate) {
                document.getElementById('outputSdp').value = btoa(JSON.stringify(pc.localDescription));
                setStatus("Copy this code and give it BACK to the Sender.");
            }
        };
    } catch (e) {
        alert("Invalid code. Make sure you copied the whole thing!");
    }
}

// 4. Sender: Finalize
async function finish() {
    const raw = document.getElementById('inputSdp').value;
    const answer = JSON.parse(atob(raw));
    await pc.setRemoteDescription(new RTCSessionDescription(answer));
    setStatus("Connected!");
}

// Handle incoming stream
pc.ontrack = (e) => {
    setStatus("Receiving Video!");
    document.getElementById('v').srcObject = e.streams[0];
};
</script>
</body>
</html>
